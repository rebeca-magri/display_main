<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natura</title>

    <link rel="stylesheet" href="./css/global.css">
</head>

<body>

    <section class="brands">

        <div class="brands__title">
            <h1>conheça nossas marcas</h1>
        </div>

        <div class="brands__grid">
            <article class="brand-card">

                <div class="brand-card__image">
                    <span>IMAGEM</span>
                </div>

                <h2 class="brand-card__title">Kaiak</h2>

                <div class="brand-card__description">
                    <p>fragrâncias aromáticas para quem busca todo o frecor do mar.</p>
                </div>

                <button class="brand-card__button">conhecer</button>

            </article>

            <article class="brand-card">

                <div class="brand-card__image">
                    <span>IMAGEM</span>
                </div>

                <h2 class="brand-card__title">Essencial</h2>

                <div class="brand-card__description">
                    <p>fragrâncias sofisticadas com ingredientes da perfumaria mundial e biodiversidade brasileira.</p>
                </div>

                <button class="brand-card__button">conhecer</button>

            </article>

            <article class="brand-card">

                <div class="brand-card__image">
                    <span>IMAGEM</span>
                </div>

                <h2 class="brand-card__title">Luna</h2>

                <div class="brand-card__description">
                    <p>criações autênticas e marcantes com o exclusivo chipre Natura.</p>
                </div>

                <button class="brand-card__button">conhecer</button>

            </article>
        </div>

    </section>

</html>
